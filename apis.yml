apis:
- aid: citibank-canada:citi-institutional-citiconnect-api
  name: Citi Institutional (CitiConnect) API Platform
  description: >-
    Citigroup's group-level institutional API platform (Citi Developer Experience /
    CitiConnect, from Treasury and Trade Solutions) that Citi Canada's corporate and
    institutional clients integrate with for payments, statements and reporting,
    balance inquiry, beneficiary/payee data and FX. Documentation and the sandbox /
    API Explorer sit behind client onboarding; there is no Canada-specific developer
    portal and no publicly downloadable OpenAPI/Swagger definition. Listed as the
    honest API surface serving this Schedule II entity's clients, not a Citi Canada
    first-party public API.
