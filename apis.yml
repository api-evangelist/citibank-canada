name: Citibank Canada
kind: company
description: >-
  Citibank Canada (Citi Canada) is the Canadian arm of Citigroup, chartered
  under Canada's Bank Act as a Schedule II (foreign bank subsidiary) deposit-taking
  institution, established in 1919 in Toronto and headquartered at Citigroup Place,
  123 Front Street West. It is a member of the Canadian Bankers Association and the
  Canada Deposit Insurance Corporation (CDIC). Citi Canada is an institutional and
  corporate bank only — securities trading, cash management, treasury, trade finance,
  custody, clearing, securities financing and private banking — having exited Canadian
  consumer retail banking years ago (its MasterCard portfolio was sold to CIBC in 2010
  and CitiFinancial Canada, now Fairstone, was divested in 2017). It runs no
  Canada-specific developer portal; its corporate and institutional clients integrate
  through Citigroup's group-level Citi Developer Experience and CitiConnect API
  platform for payments, statements/reporting, balance inquiry and FX. Canada has no
  operational open-banking mandate — the federal Consumer-Driven Banking framework
  (Budget 2024 / FES 2024, overseen by the FCAC) is legislated but not yet live — and
  because Citi Canada holds no retail consumer accounts here, consumer data-aggregation
  access is not applicable to this entity.
