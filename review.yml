actions:
  apisYmlUpdated: true
  reason: |
    Recorded one honest API surface — the Citigroup group-level Citi
    Institutional (CitiConnect) API platform that serves Citi Canada's
    institutional clients — with confirmed live humanURL, and documented that
    there is no Canada-specific first-party public API, no downloadable spec,
    no FDX/1033 posture, and no applicable consumer aggregator access.
